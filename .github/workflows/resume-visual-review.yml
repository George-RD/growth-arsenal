name: Temporary resume visual review

on:
  push:
    branches:
      - agent/resume-visual-review
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_URL: https://georgerd.com/
    steps:
      - name: Check out harness
        uses: actions/checkout@v4

      - name: Mirror public portfolio shell
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p visual-review/assets
          curl --fail --location --retry 3 --retry-all-errors "$TARGET_URL" -o visual-review/index.html
          curl --fail --location --retry 3 --retry-all-errors "${TARGET_URL}styles.css" -o visual-review/styles.css
          curl --fail --location --retry 3 --retry-all-errors "${TARGET_URL}app.js" -o visual-review/app.js
          curl --fail --location --retry 3 --retry-all-errors "${TARGET_URL}assets/favicon.svg" -o visual-review/assets/favicon.svg
          curl --fail --location --retry 3 --retry-all-errors "${TARGET_URL}assets/social-preview.svg" -o visual-review/assets/social-preview.svg
          curl --fail --location --retry 3 --retry-all-errors "${TARGET_URL}assets/yarnling-story-library.svg" -o visual-review/assets/yarnling-story-library.svg
          grep -q 'I turn unclear, consequential problems into systems people can use.' visual-review/index.html
          BROWSER="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER"
          echo "BROWSER=$BROWSER" >> "$GITHUB_ENV"
          "$BROWSER" --version | tee visual-review/browser-version.txt

      - name: Capture production reference
        shell: bash
        run: |
          set -euo pipefail
          FLAGS=(
            --headless=new
            --no-sandbox
            --disable-gpu
            --disable-dev-shm-usage
            --hide-scrollbars
            --run-all-compositor-stages-before-draw
            --virtual-time-budget=5000
            --force-device-scale-factor=1
          )
          "$BROWSER" "${FLAGS[@]}" --window-size=1440,1000 \
            --screenshot="${PWD}/visual-review/production-desktop.png" "$TARGET_URL"
          "$BROWSER" "${FLAGS[@]}" --window-size=390,844 \
            --screenshot="${PWD}/visual-review/production-mobile.png" "$TARGET_URL"

          python3 - <<'PY'
          from pathlib import Path
          import json

          root = Path('visual-review')
          summary = {
              'target': 'https://georgerd.com/',
              'html_bytes': (root / 'index.html').stat().st_size,
              'css_bytes': (root / 'styles.css').stat().st_size,
              'app_bytes': (root / 'app.js').stat().st_size,
              'assets': sorted(path.name for path in (root / 'assets').iterdir()),
          }
          (root / 'summary.json').write_text(json.dumps(summary, indent=2))
          print(json.dumps(summary, indent=2))
          PY

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resume-production-shell
          path: visual-review
          if-no-files-found: error
          retention-days: 3
