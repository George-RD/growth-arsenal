name: Growth Arsenal tests

on:
  pull_request:
    paths:
      - "skills/**"
      - "evaluations/**"
      - ".claude-plugin/**"
      - "CLAUDE.md"
      - "DESIGN.md"
      - "README.md"
      - "docs/**"
      - "install.sh"
  push:
    branches: [main]
    paths:
      - "skills/**"
      - "evaluations/**"
      - ".claude-plugin/**"
      - "CLAUDE.md"
      - "DESIGN.md"
      - "README.md"
      - "docs/**"
      - "install.sh"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify Skills CLI compatibility
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/skills-smoke"
          cd "$RUNNER_TEMP/skills-smoke"
          npx --yes skills@1.5.23 add "$GITHUB_WORKSPACE" --skill '*' -a codex -y --copy
          for skill in \
            business-case \
            business-copy-style \
            executive-writing \
            grandslam-offer \
            growth-arsenal-workspace \
            hundred-million-leads \
            plugin-feedback \
            voice-calibration \
            writing-core
          do
            test -f ".agents/skills/$skill/SKILL.md"
          done
          test -f ".agents/skills/business-case/templates/decision-model.md"
          test -f ".agents/skills/business-case/references/economic-model.md"
          test -f ".agents/skills/writing-core/references/factual-kernel.md"
      - name: Verify selective Skills CLI installs
        run: |
          set -euo pipefail
          offer_root="$RUNNER_TEMP/skills-selective-offer"
          copy_root="$RUNNER_TEMP/skills-selective-copy"
          mkdir -p "$offer_root" "$copy_root"

          cd "$offer_root"
          npx --yes skills@1.5.23 add "$GITHUB_WORKSPACE" --skill grandslam-offer -a codex -y --copy
          test -f ".agents/skills/grandslam-offer/SKILL.md"
          test -d ".agents/skills/grandslam-offer/references"
          test -d ".agents/skills/grandslam-offer/templates"
          test ! -e ".agents/skills/growth-arsenal-workspace"
          test ! -e ".agents/skills/business-copy-style"
          test ! -e ".agents/skills/writing-core"

          cd "$copy_root"
          npx --yes skills@1.5.23 add "$GITHUB_WORKSPACE" --skill business-copy-style -a codex -y --copy
          test -f ".agents/skills/business-copy-style/SKILL.md"
          test -f ".agents/skills/business-copy-style/scripts/copy-lint.sh"
          test -f ".agents/skills/business-copy-style/scripts/copy-compare.py"
          test -d ".agents/skills/business-copy-style/references"
          test -d ".agents/skills/business-copy-style/templates"
          test ! -e ".agents/skills/grandslam-offer"

          for skill in business-case executive-writing voice-calibration writing-core
          do
            root="$RUNNER_TEMP/skills-selective-$skill"
            mkdir -p "$root"
            cd "$root"
            npx --yes skills@1.5.23 add "$GITHUB_WORKSPACE" --skill "$skill" -a codex -y --copy
            test -f ".agents/skills/$skill/SKILL.md"
            count="$(find .agents/skills -mindepth 1 -maxdepth 1 -type d | wc -l)"
            test "$count" -eq 1
          done

          test -f "$RUNNER_TEMP/skills-selective-business-case/.agents/skills/business-case/templates/decision-model.md"
          test -f "$RUNNER_TEMP/skills-selective-business-case/.agents/skills/business-case/references/economic-model.md"
          test -f "$RUNNER_TEMP/skills-selective-business-case/.agents/skills/business-case/evals/evals.json"
          test -f "$RUNNER_TEMP/skills-selective-executive-writing/.agents/skills/executive-writing/evals/evals.json"
          test -f "$RUNNER_TEMP/skills-selective-voice-calibration/.agents/skills/voice-calibration/evals/evals.json"
          test -f "$RUNNER_TEMP/skills-selective-writing-core/.agents/skills/writing-core/references/factual-kernel.md"
          test -f "$RUNNER_TEMP/skills-selective-writing-core/.agents/skills/writing-core/evals/evals.json"
      - name: Verify selective offer dependency negotiation contract
        run: |
          # Keep this proof aligned with docs/agents/skill-dependencies.md. Replace the
          # instruction-level shim when native Skills CLI dependencies cover the contract.
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          workspace = Path(os.environ["GITHUB_WORKSPACE"])
          installed = (
              Path(os.environ["RUNNER_TEMP"])
              / "skills-selective-offer"
              / ".agents"
              / "skills"
              / "grandslam-offer"
              / "SKILL.md"
          ).read_text(encoding="utf-8")

          workspace_command = (
              "npx skills add George-RD/growth-arsenal --skill growth-arsenal-workspace"
          )
          writing_command = (
              "npx skills add George-RD/growth-arsenal --skill writing-core"
          )
          copy_command = (
              "npx skills add George-RD/growth-arsenal --skill business-copy-style"
          )

          assert "growth-arsenal-workspace` is a hard dependency" in installed
          assert "writing-core` is a hard dependency" in installed
          assert "business-copy-style` is a quality dependency" in installed
          assert workspace_command in installed
          assert writing_command in installed
          assert copy_command in installed
          assert "degraded/unverified" in installed

          evals = json.loads(
              (workspace / "skills/grandslam-offer/evals/evals.json").read_text(
                  encoding="utf-8"
              )
          )["evals"]
          by_name = {case["name"]: case for case in evals}
          missing_workspace = by_name["Missing workspace hard dependency"]
          missing_copy = by_name["Missing copy quality dependency"]

          workspace_expectations = "\n".join(missing_workspace["expectations"])
          copy_expectations = "\n".join(missing_copy["expectations"])

          assert workspace_command in workspace_expectations
          assert "does not offer a degraded or fallback workspace mode" in workspace_expectations
          assert copy_command in copy_expectations
          assert "degraded/unverified" in copy_expectations
          assert "never claims" in copy_expectations
          PY
      - name: Compile Python scripts
        run: |
          python -m py_compile skills/growth-arsenal-workspace/scripts/*.py
