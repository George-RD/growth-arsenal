<svg xmlns="http://www.w3.org/2000/svg" width="700" height="1030" viewBox="0 0 700 1030" role="img" aria-labelledby="title desc">
  <title id="title">How growth-arsenal fits together</title>
  <desc id="desc">A rough business idea can move through offer, leads and copy workshops. Every phase is built, attacked by independent reviewers, revised and saved as project files.</desc>

  <rect x="2" y="2" width="696" height="1026" fill="#f6f8ff" stroke="#0e1630" stroke-width="4"/>

  <text x="30" y="44" font-family="monospace" font-size="21" font-weight="700" fill="#0e1630">USE ONE WORKSHOP OR RUN ALL THREE</text>
  <text x="30" y="72" font-family="monospace" font-size="17" font-weight="700" fill="#0e1630">RUNS INSIDE YOUR AI CODING AGENT</text>

  <g transform="translate(30 96)">
    <path d="M0 0h620v126H0z" fill="#1450ff" stroke="#0e1630" stroke-width="3"/>
    <text x="22" y="31" font-family="monospace" font-size="18" font-weight="700" fill="#dfe7ff">INPUT / UNTESTED</text>
    <text x="22" y="83" font-family="Arial Narrow, Arial, sans-serif" font-size="43" font-weight="900" fill="#fff">ROUGH <tspan fill="#d9ff4f">IDEA</tspan></text>
    <text x="350" y="54" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#fff">Assumptions</text>
    <text x="350" y="88" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#fff">Questions</text>
    <path d="M514 0h106v126H514z" fill="#ff5c35" stroke="#0e1630" stroke-width="3"/>
