    <path d="M0 0h160v180H0z" fill="#0e1630"/>
    <text x="22" y="39" font-family="monospace" font-size="20" font-weight="700" fill="#fff">01 / OFFER</text>
    <text x="22" y="93" font-family="Arial Narrow, Arial, sans-serif" font-size="32" font-weight="900" fill="#fff">PACKAGE</text>
