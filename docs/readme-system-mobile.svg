    <text x="567" y="79" text-anchor="middle" font-family="monospace" font-size="18" font-weight="700" fill="#0e1630">TO FIX</text>
  </g>

  <path d="M350 222v30" stroke="#0e1630" stroke-width="5"/>
  <path d="M339 245l11 14 11-14z" fill="#0e1630"/>

  <g transform="translate(30 260)">
