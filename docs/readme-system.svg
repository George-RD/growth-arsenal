<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
  <title id="title">How growth-arsenal fits together</title>
  <desc id="desc">A rough business idea can move through offer, leads and copy workshops. Every phase is built, attacked by independent reviewers, revised and saved as project files.</desc>

  <style>
    .motion-layer { pointer-events: none; }
    .motion-signal { opacity: 0; }
    .motion-line {
      fill: none;
      stroke-width: 5;
      stroke-linecap: square;
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
    }
    .signal-1 { animation: signal-1 18s linear 1 both; }
    .signal-1 .motion-line { animation: draw-1 18s linear 1 both; }
    .signal-2 { animation: signal-2 18s linear 1 both; }
    .signal-2 .motion-line { animation: draw-2 18s linear 1 both; }
    .signal-3 { animation: signal-3 18s linear 1 both; }
    .signal-3 .motion-line { animation: draw-3 18s linear 1 both; }
    .signal-4 { animation: signal-4 18s linear 1 both; }
    .signal-4 .motion-line { animation: draw-4 18s linear 1 both; }
    .phase-cursor {
      opacity: 0;
      transform-box: fill-box;
      transform-origin: center;
      animation: phase-cursor-desktop 18s cubic-bezier(0.16, 1, 0.3, 1) 1 both;
    }
    @keyframes signal-1 {
      0%, 5%, 13%, 100% { opacity: 0; }
      7%, 11% { opacity: 1; }
    }
    @keyframes draw-1 {
      0%, 5% { stroke-dashoffset: 1; }
      11%, 100% { stroke-dashoffset: 0; }
    }
    @keyframes signal-2 {
      0%, 12%, 20%, 100% { opacity: 0; }
      14%, 18% { opacity: 1; }
    }
    @keyframes draw-2 {
      0%, 12% { stroke-dashoffset: 1; }
      18%, 100% { stroke-dashoffset: 0; }
    }
    @keyframes signal-3 {
      0%, 19%, 27%, 100% { opacity: 0; }
      21%, 25% { opacity: 1; }
    }
    @keyframes draw-3 {
      0%, 19% { stroke-dashoffset: 1; }
      25%, 100% { stroke-dashoffset: 0; }
    }
    @keyframes signal-4 {
      0%, 26%, 34%, 100% { opacity: 0; }
      28%, 32% { opacity: 1; }
    }
    @keyframes draw-4 {
      0%, 26% { stroke-dashoffset: 1; }
      32%, 100% { stroke-dashoffset: 0; }
    }
    @keyframes phase-cursor-desktop {
      0%, 40% { opacity: 0; transform: translateX(0); }
      42%, 47% { opacity: 1; transform: translateX(0); }
      49%, 54% { opacity: 1; transform: translateX(230px); }
      56%, 61% { opacity: 1; transform: translateX(460px); }
      63%, 68% { opacity: 1; transform: translateX(724px); }
      70%, 100% { opacity: 0; transform: translateX(724px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .motion-layer { display: none; }
    }
  </style>

  <rect x="2" y="2" width="1196" height="466" fill="#f6f8ff" stroke="#0e1630" stroke-width="4"/>

